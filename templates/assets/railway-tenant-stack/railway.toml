[build]
builder = "DOCKERFILE"

# ─── Postgres ────────────────────────────────────────────────
# Railway Postgres plugin; no build needed.
# Logical DBs: n8n, langfuse, librechat, paperclip, better_auth, librechat_rag

# ─── better-auth ─────────────────────────────────────────────
# Deployed from levinnovation/agentyx-auth-service fork via Railway GitHub App.
[better-auth]
root = "services/better-auth"
startCommand = ""

[better-auth.variables]
PORT = "3000"
BETTER_AUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
BETTER_AUTH_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=better_auth"

# ─── auth-proxy ──────────────────────────────────────────────
[auth-proxy]
root = "services/auth-proxy"
startCommand = ""

[auth-proxy.variables]
BETTER_AUTH_INTERNAL_URL = "http://better-auth.railway.internal:3000"
N8N_INTERNAL_URL = "http://n8n.railway.internal:5678"
FLOWISE_INTERNAL_URL = "http://flowise.railway.internal:3000"
PAPERCLIP_INTERNAL_URL = "http://paperclip.railway.internal:3000"

# ─── n8n ─────────────────────────────────────────────────────
# Deployed from levinnovation/agentyx-n8n fork via Railway GitHub App.
[n8n]
root = "services/n8n"
startCommand = "n8n start"

[n8n.variables]
N8N_PORT = "5678"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_DATABASE = "n8n"
DB_POSTGRESDB_HOST = "${{Postgres.PGHOST}}"
DB_POSTGRESDB_PORT = "${{Postgres.PGPORT}}"
DB_POSTGRESDB_USER = "${{Postgres.PGUSER}}"
DB_POSTGRESDB_PASSWORD = "${{Postgres.PGPASSWORD}}"
WEBHOOK_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"

# ─── LibreChat ───────────────────────────────────────────────
# Deployed from levinnovation/agentyx-librechat fork via Railway GitHub App.
[librechat]
root = "services/librechat"
startCommand = "node api/server/index.js"

[librechat.variables]
HOST = "0.0.0.0"
PORT = "3080"
MONGO_URI = ""
ENDPOINTS = "custom"
CUSTOM_NAME = "Agentyx Agent"
CUSTOM_BASE_URL = "http://agent.railway.internal:8000"
CUSTOM_API_KEY = "${{CUSTOM_API_KEY}}"
OPENID_CLIENT_ID = "${{OPENID_CLIENT_ID}}"
OPENID_CLIENT_SECRET = "${{OPENID_CLIENT_SECRET}}"
OPENID_ISSUER = "${{OPENID_ISSUER}}"
OPENID_SCOPE = "openid email profile"
OPENID_BUTTON_LABEL = "Sign in with Agentyx"
RAG_API_URL = "http://rag-api.railway.internal:8000"

# ─── Paperclip ───────────────────────────────────────────────
# Deployed from levinnovation/agentyx-paperclip fork via Railway GitHub App.
[paperclip]
root = "services/paperclip"
startCommand = ""

[paperclip.variables]
PAPERCLIP_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=paperclip"
PAPERCLIP_PORT = "3000"
PAPERCLIP_AUTH_TRUSTED_PROXY = "true"
PAPERCLIP_AUTH_TRUSTED_PROXY_SECRET = "${{PAPERCLIP_AUTH_TRUSTED_PROXY_SECRET}}"
BETTER_AUTH_TRUSTED_ORIGINS = "${{BETTER_AUTH_TRUSTED_ORIGINS}}"

# ─── Langfuse ────────────────────────────────────────────────
[langfuse]
image = "ghcr.io/langfuse/langfuse:latest"
startCommand = ""

[langfuse.variables]
DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=langfuse"
NEXTAUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
PORT = "3000"
AUTH_CUSTOM_NAME = "Agentyx"
AUTH_CUSTOM_CLIENT_ID = "${{AUTH_CUSTOM_CLIENT_ID}}"
AUTH_CUSTOM_CLIENT_SECRET = "${{AUTH_CUSTOM_CLIENT_SECRET}}"
AUTH_CUSTOM_ISSUER = "${{AUTH_CUSTOM_ISSUER}}"
AUTH_CUSTOM_SCOPE = "openid email profile"

# ─── Agent ───────────────────────────────────────────────────
[agent]
image = "${{AGENT_IMAGE}}"
startCommand = ""

[agent.variables]
PORT = "8000"
BETTER_AUTH_JWKS_URL = "${{BETTER_AUTH_JWKS_URL}}"
BETTER_AUTH_ISSUER = "${{BETTER_AUTH_ISSUER}}"
BETTER_AUTH_AUDIENCE = "${{BETTER_AUTH_AUDIENCE}}"
AUTH_REQUIRED = "false"

# ─── Agentyx Portal ──────────────────────────────────────────
# Deployed from levinnovation/agentyx-client-portal fork via Railway GitHub App.
[agentyx-portal]
root = "services/agentyx-portal"
startCommand = ""

[agentyx-portal.variables]
PORT = "8080"
BETTER_AUTH_URL = "http://better-auth.railway.internal:3000"

# ─── Flowise ─────────────────────────────────────────────────
# Deployed from levinnovation/agentyx-flowise fork via Railway GitHub App.
[flowise]
root = "services/flowise"
startCommand = "flowise start"

[flowise.variables]
PORT = "3000"
DATABASE_PATH = "/root/.flowise"

# ─── RAG API (LibreChat vector embeddings) ───────────────────
[rag-api]
image = "registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest"
startCommand = ""

[rag-api.variables]
RAG_PORT = "8000"
DB_HOST = "postgres.railway.internal"
DB_PORT = "5432"
POSTGRES_DB = "librechat_rag"
POSTGRES_USER = "${{Postgres.PGUSER}}"
POSTGRES_PASSWORD = "${{Postgres.PGPASSWORD}}"
PGVECTOR_CREATE_EXTENSION = "False"
EMBEDDINGS_PROVIDER = "openai"
EMBEDDINGS_MODEL = "text-embedding-3-small"
RAG_OPENAI_API_KEY = "${{OPENAI_API_KEY}}"
