[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentyx-vertical-assets"
version = "0.1.0"
description = "Vertical-domain agentic asset management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "jsonschema",
    "rich",
    "typer",
    "jinja2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
