[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotation-assistant"
version = "1.1.0"
description = "Euromobilia Quotation Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "supabase>=2.0.0",
    "openai>=1.0.0",
    "tavily-python>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]
