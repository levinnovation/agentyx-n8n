# Euromobilia Quotation Assistant — Hostinger VPS
# Deploy: cd /opt/euromobilia-agent && docker compose pull && docker compose up -d
#
# This container must be connected to the n8n_default network so that
# the Caddy reverse proxy (in the n8n-hostinger deploy) can route /agent/*
# to this service by container name.
#
# CI builds the image and pushes to GHCR. The VPS pulls the pre-built image.
# For local development: docker compose up -d --build (uses build context)

services:
  agent:
    image: ${AGENT_IMAGE:-euromobilia-agent:local-build}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: ${AGENT_PULL_POLICY:-build}
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - agent_data:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  agent_data:
