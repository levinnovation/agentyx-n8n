[build]
builder = "DOCKERFILE"

# ─── Postgres ────────────────────────────────────────────────
# Railway Postgres plugin; no build needed.

# ─── n8n ─────────────────────────────────────────────────────
[n8n]
image = "n8nio/n8n:1.84.0"
startCommand = "n8n start"

[n8n.variables]
N8N_PORT = "5678"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_DATABASE = "n8n"
DB_POSTGRESDB_HOST = "${{Postgres.PGHOST}}"
DB_POSTGRESDB_PORT = "${{Postgres.PGPORT}}"
DB_POSTGRESDB_USER = "${{Postgres.PGUSER}}"
DB_POSTGRESDB_PASSWORD = "${{Postgres.PGPASSWORD}}"
WEBHOOK_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"

# ─── LibreChat ───────────────────────────────────────────────
[librechat]
image = "ghcr.io/danny-avila/librechat:v0.7.7"
startCommand = "node api/server/index.js"

[librechat.variables]
HOST = "0.0.0.0"
PORT = "3080"
MONGO_URI = ""
ENDPOINTS = "custom"
CUSTOM_NAME = "Agentyx Agent"
CUSTOM_BASE_URL = "http://agent.railway.internal:8000"
CUSTOM_API_KEY = "${{CUSTOM_API_KEY}}"

# ─── Paperclip ───────────────────────────────────────────────
[paperclip]
root = "services/paperclip"
startCommand = ""

[paperclip.variables]
PAPERCLIP_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=paperclip"
PAPERCLIP_PORT = "3000"

# ─── Langfuse ────────────────────────────────────────────────
[langfuse]
image = "ghcr.io/langfuse/langfuse:3.52"
startCommand = ""

[langfuse.variables]
DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=langfuse"
NEXTAUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
PORT = "3000"

# ─── Agent ───────────────────────────────────────────────────
[agent]
image = "${{AGENT_IMAGE}}"
startCommand = ""

[agent.variables]
PORT = "8000"

# ─── Agentyx Portal ──────────────────────────────────────────
[agentyx-portal]
image = "${{PORTAL_IMAGE}}"
startCommand = ""

[agentyx-portal.variables]
PORT = "8080"

# ─── Flowise (optional — commented out by default) ───────────
