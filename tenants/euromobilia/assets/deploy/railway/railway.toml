# ─── Postgres ────────────────────────────────────────────────
# Railway Postgres plugin; no build needed.
# Shared DB: railway; per-service schemas: n8n, langfuse, librechat, paperclip, better_auth

# ─── better-auth ─────────────────────────────────────────────
# NOTE: Built from this repo. Source lives in services/better-auth/.
[better-auth]
root = "services/better-auth"
startCommand = ""

[better-auth.build]
builder = "DOCKERFILE"

[better-auth.variables]
PORT = "3000"
BETTER_AUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
BETTER_AUTH_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=better_auth"

# ─── auth-proxy ──────────────────────────────────────────────
# NOTE: Built from this repo. Source lives in services/auth-proxy/.
[auth-proxy]
root = "services/auth-proxy"
startCommand = ""

[auth-proxy.build]
builder = "DOCKERFILE"

[auth-proxy.variables]
BETTER_AUTH_INTERNAL_URL = "http://better-auth.railway.internal:3000"
N8N_INTERNAL_URL = "http://n8n.railway.internal:5678"
FLOWISE_INTERNAL_URL = "http://flowise.railway.internal:3000"
PAPERCLIP_INTERNAL_URL = "http://paperclip.railway.internal:3000"
LIBRECHAT_INTERNAL_URL = "http://librechat.railway.internal:3080"
LIBRECHAT_PUBLIC_HOST = ""

# ─── n8n ─────────────────────────────────────────────────────
# Public ingress is via auth-proxy; no public domain on this service.
# Custom image with Agentyx community nodes baked in.
# Built by .github/workflows/build-n8n-image.yml in the assets repo.
[n8n]
image = "ghcr.io/levinnovation/agentyx-n8n:latest"
startCommand = "n8n start"

[n8n.variables]
N8N_PORT = "5678"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_DATABASE = "railway"
DB_POSTGRESDB_SCHEMA = "n8n"
DB_POSTGRESDB_HOST = "${{Postgres.PGHOST}}"
DB_POSTGRESDB_PORT = "${{Postgres.PGPORT}}"
DB_POSTGRESDB_USER = "${{Postgres.PGUSER}}"
DB_POSTGRESDB_PASSWORD = "${{Postgres.PGPASSWORD}}"
WEBHOOK_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"

# ─── LibreChat ───────────────────────────────────────────────
# NOTE: Deployed from levinnovation/agentyx-librechat fork via Railway GitHub App.
[librechat]
root = "."
startCommand = "node api/server/index.js"

[librechat.build]
builder = "DOCKERFILE"

[librechat.variables]
HOST = "0.0.0.0"
PORT = "3080"
MONGO_URI = ""
# Only custom endpoints (defined in librechat.yaml) are enabled.
ENDPOINTS = "custom"
# Explicitly point to the committed librechat.yaml config.
CONFIG_PATH = "librechat.yaml"
# Preset OpenRouter key — resolved server-side, never sent to frontend.
OPENROUTER_API_KEY = "${{OPENROUTER_API_KEY}}"
OPENID_CLIENT_ID = "${{OPENID_CLIENT_ID}}"
OPENID_CLIENT_SECRET = "${{OPENID_CLIENT_SECRET}}"
OPENID_ISSUER = "${{OPENID_ISSUER}}"
OPENID_SCOPE = "openid email profile"
OPENID_BUTTON_LABEL = "Sign in with Agentyx"
RAG_API_URL = "http://rag-api.railway.internal:8000"

# ─── Paperclip ───────────────────────────────────────────────
# Public ingress is via auth-proxy; no public domain on this service.
# NOTE: Deployed from levinnovation/agentyx-paperclip fork via Railway GitHub App.
[paperclip]
root = "."
startCommand = ""

[paperclip.build]
builder = "DOCKERFILE"

[paperclip.variables]
PAPERCLIP_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=paperclip"
PAPERCLIP_PORT = "3000"
PAPERCLIP_AUTH_TRUSTED_PROXY = "true"
PAPERCLIP_AUTH_TRUSTED_PROXY_SECRET = "${{PAPERCLIP_AUTH_TRUSTED_PROXY_SECRET}}"
PAPERCLIP_ALLOWED_HOSTNAMES = "paperclip.railway.internal,${{RAILWAY_PUBLIC_DOMAIN}}"
BETTER_AUTH_TRUSTED_ORIGINS = "${{BETTER_AUTH_TRUSTED_ORIGINS}}"

# ─── Langfuse ────────────────────────────────────────────────
# Upstream image — no Agentyx fork.
[langfuse]
image = "ghcr.io/langfuse/langfuse:3.52"
startCommand = ""

[langfuse.variables]
DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=langfuse"
NEXTAUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
PORT = "3000"
AUTH_CUSTOM_NAME = "Agentyx"
AUTH_CUSTOM_CLIENT_ID = "${{AUTH_CUSTOM_CLIENT_ID}}"
AUTH_CUSTOM_CLIENT_SECRET = "${{AUTH_CUSTOM_CLIENT_SECRET}}"
AUTH_CUSTOM_ISSUER = "${{AUTH_CUSTOM_ISSUER}}"
AUTH_CUSTOM_SCOPE = "openid email profile"

# ─── Agent ───────────────────────────────────────────────────
# Built from per-tenant GHCR image.
[agent]
image = "${{AGENT_IMAGE}}"
startCommand = ""

[agent.variables]
PORT = "8000"
BETTER_AUTH_JWKS_URL = "${{BETTER_AUTH_JWKS_URL}}"
BETTER_AUTH_ISSUER = "${{BETTER_AUTH_ISSUER}}"
BETTER_AUTH_AUDIENCE = "${{BETTER_AUTH_AUDIENCE}}"
AUTH_REQUIRED = "false"

# ─── Agentyx Portal ──────────────────────────────────────────
# NOTE: Deployed from levinnovation/agentyx-client-portal fork via Railway GitHub App.
[agentyx-portal]
root = "."
startCommand = ""

[agentyx-portal.build]
builder = "DOCKERFILE"

[agentyx-portal.variables]
PORT = "8080"
BETTER_AUTH_URL = "http://better-auth.railway.internal:3000"

# ─── Flowise ─────────────────────────────────────────────────
# NOTE: Deployed from levinnovation/agentyx-flowise fork via Railway GitHub App.
[flowise]
root = "."
startCommand = "flowise start"

[flowise.build]
builder = "DOCKERFILE"

[flowise.variables]
PORT = "3000"
DATABASE_PATH = "/root/.flowise"

# ─── RAG API (LibreChat vector embeddings) ───────────────────
# Upstream image — no Agentyx fork.
[rag-api]
image = "registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest"
startCommand = ""

[rag-api.variables]
RAG_PORT = "8000"
DB_HOST = "postgres.railway.internal"
DB_PORT = "5432"
POSTGRES_DB = "librechat_rag"
POSTGRES_USER = "${{Postgres.PGUSER}}"
POSTGRES_PASSWORD = "${{Postgres.PGPASSWORD}}"
PGVECTOR_CREATE_EXTENSION = "False"
EMBEDDINGS_PROVIDER = "openai"
EMBEDDINGS_MODEL = "text-embedding-3-small"
RAG_OPENAI_API_KEY = "${{OPENAI_API_KEY}}"

# ─── n8n MCP (optional) ──────────────────────────────────────
# MCP server for AI-assisted n8n workflow authoring.
# Enable by setting N8N_MCP_ENABLED=true in project variables.
[n8n-mcp]
image = "ghcr.io/czlonkowski/n8n-mcp:latest"
startCommand = "node dist/mcp/index.js --http"

[n8n-mcp.variables]
PORT = "3000"
N8N_API_URL = "http://n8n.railway.internal:5678/api/v1"
N8N_API_KEY = "${{N8N_API_KEY}}"
MCP_MODE = "http"
AUTH_TOKEN = "${{N8N_MCP_AUTH_TOKEN}}"
