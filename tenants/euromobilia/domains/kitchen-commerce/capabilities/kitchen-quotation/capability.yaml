id: kitchen-quotation
name: Kitchen Quotation
tenant: euromobilia
domain: kitchen-commerce
purpose: >
  Receive WhatsApp customer requests via Kapso, classify intent (appliance /
  furniture / full kitchen / sales lead / support / scheduling / human handoff /
  quotation continue / quotation consolidate / quotation new), gather missing
  info, retrieve catalog and pricing context from Supabase, produce a
  WhatsApp-safe quotation, and optionally trigger document generation or
  human handoff.
assets:
  - quotation-assistant
  - n8n-hostinger
  - n8n
  - kapso-inbound-quotation
  - whatsapp-kapso
  - bitrix24
  - slack
  - composio
  - product-catalog
  - catalog-rag
  - supabase
  - openrouter
  - kapso-integration
status: scaffolded
sla:
  response_time_ms: 5000
  availability: "99.9%"
dependencies:
  - product-catalog-retrieval
  - human-handoff
  - quote-document-generation
