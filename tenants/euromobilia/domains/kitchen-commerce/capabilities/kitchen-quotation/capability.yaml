id: kitchen-quotation
name: Kitchen Quotation
tenant: euromobilia
domain: kitchen-commerce
purpose: >
  Receive WhatsApp customer requests, classify intent (appliance / furniture /
  full kitchen), gather missing info, retrieve catalog/pricing context, produce
  a WhatsApp-safe quotation, and optionally trigger document generation or
  human handoff.
assets:
  - quotation-assistant
  - kapso-inbound-quotation
  - whatsapp-kapso
  - bitrix24
  - slack
  - composio
  - product-catalog
  - catalog-rag
  - supabase
status: scaffolded
sla:
  response_time_ms: 5000
  availability: "99.9%"
dependencies:
  - product-catalog-retrieval
  - human-handoff
  - quote-document-generation
