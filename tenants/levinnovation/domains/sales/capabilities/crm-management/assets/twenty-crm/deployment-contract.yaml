id: twenty-crm-railway
target_platform: railway
artifacts:
  - tenants/levinnovation/assets/deploy/railway/railway.toml
  - tenants/levinnovation/domains/sales/capabilities/crm-management/assets/twenty-crm/asset.yaml
env_vars:
  - SERVER_URL
  - NODE_PORT
  - NODE_ENV
  - PG_DATABASE_URL
  - REDIS_URL
  - APP_SECRET
  - STORAGE_TYPE
  - STORAGE_S3_REGION
  - STORAGE_S3_NAME
  - STORAGE_S3_ENDPOINT
  - STORAGE_S3_ACCESS_KEY_ID
  - STORAGE_S3_SECRET_ACCESS_KEY
  - IS_MULTIWORKSPACE_ENABLED
secrets:
  - APP_SECRET
  - PG_DATABASE_PASSWORD
  - STORAGE_S3_SECRET_ACCESS_KEY
health_check:
  path: /healthz
  port: 3000
