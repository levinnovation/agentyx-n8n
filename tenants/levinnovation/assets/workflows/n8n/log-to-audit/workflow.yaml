apiVersion: agentyx.io/v1
kind: N8nWorkflow
metadata:
  name: log-to-audit
  tenant: levinnovation
  domain: core-pipeline
  capability: sub-workflows
  version: "1.0.0"
  status: draft
spec:
  trigger:
    type: webhook
    config:
      httpMethod: POST
      path: log-audit
      responseMode: lastNode

  nodes:
    - name: Webhook Trigger
      type: webhook
      position: [240, 300]
      config:
        httpMethod: POST
        path: log-audit
        responseMode: lastNode

    - name: Audit Logger
      type: agentyxAuditLogger
      position: [440, 300]
      config:
        action: "={{ $json.action || 'execute' }}"
        tenant: "={{ $json.tenant || 'levinnovation' }}"
        domain: "={{ $json.domain || '' }}"
        capability: "={{ $json.capability || '' }}"
        subWorkflows: "={{ JSON.stringify($json.sub_workflows || []) }}"
        gitHash: "={{ $json.git_hash || '' }}"
        storeMode: "={{ $json.store_mode || 'payload' }}"

  connections:
    - from: Webhook Trigger
      to: Audit Logger