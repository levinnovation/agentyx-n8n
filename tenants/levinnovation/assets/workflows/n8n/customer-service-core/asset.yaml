asset:
  name: customer-service-core
  type: n8n-workflow
  tenant: levinnovation
  domain: customer-service
  capability: lead-qualification-and-scheduling

  description: |
    Reusable core AI agent for LEV Innovation customer service.
    Receives canonical envelope from channel adapters, processes messages
    via Gemini LLM with Redis memory, hybrid KB retrieval via webhook,
    Composio tool integration (Google Calendar), Twenty CRM sync, and lead
    prequalification using BANT criteria.

  inputs:
    - channel
    - conversation_id
    - user_id
    - message
    - attachments
    - metadata

  outputs:
    - reply_text
    - reply_attachments
    - end_session
    - metadata (lead_status, qualification_score, crm_fields, calendar_action)

  dependencies:
    - service: agx-demo-composio-mcp
      endpoint: https://levinnovation.mcp.agentyx.one/mcp
      auth: Bearer MCP_AUTH_TOKEN
    - service: openrouter
      auth: OPENROUTER_API_KEY
    - service: redis
      auth: Redis account credential
    - service: twenty-crm
      endpoint: ${TWENTY_BASE_URL}
      auth: Bearer TWENTY_API_KEY
    - service: openai
      auth: OPENAI_API_KEY
      note: Used for audio transcription (Whisper)
    - service: customer-service-kb-search
      endpoint: ${KB_SEARCH_WEBHOOK_URL}
      auth: N8N_AUTH_TRUSTED_PROXY_SECRET
      note: Hybrid RRF retrieval (pgvector cosine + tsvector BM25)

  files:
    - customer-service-core.json
    - README.md
    - asset.yaml
    - .env.example
