apiVersion: agentyx.io/v1
kind: N8nWorkflow
metadata:
  name: call-agent-http
  tenant: levinnovation
  domain: core-pipeline
  capability: sub-workflows
  version: "1.0.0"
  status: draft
spec:
  trigger:
    type: webhook
    config:
      httpMethod: POST
      path: call-agent
      responseMode: lastNode

  nodes:
    - name: Webhook Trigger
      type: webhook
      position: [240, 300]
      config:
        httpMethod: POST
        path: call-agent
        responseMode: lastNode

    - name: AI Agent
      type: agentyxAIAgentBasicNode
      position: [440, 300]
      config:
        model: "={{ $json.model || 'openai/gpt-4o-mini' }}"
        temperature: "={{ $json.temperature || 0.3 }}"
        maxTokens: "={{ $json.max_tokens || 1024 }}"
        systemPrompt: "={{ $json.system_prompt || 'You are a helpful AI assistant.' }}"
        userMessage: "={{ $json.message }}"
        memoryEnabled: "={{ $json.memory_enabled || false }}"
        timeout: "={{ $json.timeout || 15000 }}"

    - name: Format Response
      type: code
      position: [640, 300]
      config:
        jsCode: |
          const agentOutput = $input.all()[0].json;
          return {
            json: {
              reply_text: agentOutput.reply_text || agentOutput.response || agentOutput.output || '',
              agent_metadata: agentOutput.metadata || {},
              tokens_used: agentOutput.tokens_used || 0,
              model_used: agentOutput.model_used || $json.model || 'unknown',
              _agent_called_at: new Date().toISOString(),
            }
          };

  connections:
    - from: Webhook Trigger
      to: AI Agent
    - from: AI Agent
      to: Format Response