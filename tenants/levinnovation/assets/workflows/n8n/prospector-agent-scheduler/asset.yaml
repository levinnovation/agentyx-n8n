apiVersion: agentyx.dev/v1
kind: Workflow
metadata:
  name: prospector-agent-scheduler
  tenant: levinnovation
  domain: sales-prospecting
  capability: outbound-prospecting
spec:
  runtime: n8n
  entrypoint: prospector-agent-scheduler.json
  workflow_id: x6UEapkGLMDXxXuv
  trigger:
    - type: manual
    - type: schedule
      cron: "0 * * * *"
      timezone: America/Costa_Rica
  subworkflows:
    - id: i06Dfr3BkClgMgT2
      name: Prospector Agent Core v2 (Levinnovation)
      purpose: actual prospecting pipeline
    - id: TBD
      name: Prospector Agent Messenger (Levinnovation)
      purpose: email outreach to qualified leads
    - id: TBD
      name: Prospector Inbound Handler (Levinnovation)
      purpose: analyze replies and notify sales
  env_optional:
    - DEFAULT_CAMPAIGN_ID
    - PROSPECTOR_DRY_RUN
