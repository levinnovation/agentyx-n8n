# LEV Innovation tenant-level Railway overrides/source of truth.
# This file focuses on the n8n queue-mode cluster topology.

[auth-proxy]
root = "services/auth-proxy"
startCommand = ""

[auth-proxy.build]
builder = "DOCKERFILE"

[auth-proxy.variables]
BETTER_AUTH_INTERNAL_URL = "http://better-auth.railway.internal:3000"
N8N_INTERNAL_URL = "http://n8n-main.railway.internal:5678"
N8N_WEBHOOK_INTERNAL_URL = "http://n8n-webhook.railway.internal:5678"
LIBRECHAT_INTERNAL_URL = "http://librechat.railway.internal:3080"
LIBRECHAT_PUBLIC_HOST = ""

[redis]
image = "redis:7-alpine"
startCommand = "redis-server --appendonly yes --requirepass $REDIS_PASSWORD"

[redis.variables]
REDIS_PASSWORD = "${{secret(48)}}"

[n8n-main]
# Custom image with Agentyx community nodes baked in. Built directly from
# this repo by Railway via services/n8n-yaml-compiler/Dockerfile.n8n (see root
# railway.toml). GHCR image source removed because the package is private and
# Railway lacks credentials to pull it.
# startCommand `start` is the subcommand passed to the upstream entrypoint
# (`/docker-entrypoint.sh` → `exec n8n "$@"`). NEVER prefix with `n8n` —
# double-prefix breaks startup with `Command "n8n" not found`.
startCommand = "start"

[n8n-main.variables]
N8N_PORT = "5678"
EXECUTIONS_MODE = "queue"
OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS = "true"
N8N_DISABLE_PRODUCTION_MAIN_PROCESS = "true"
N8N_RUNNERS_ENABLED = "true"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_DATABASE = "railway"
DB_POSTGRESDB_SCHEMA = "n8n"
DB_POSTGRESDB_HOST = "${{Postgres.PGHOST}}"
DB_POSTGRESDB_PORT = "${{Postgres.PGPORT}}"
DB_POSTGRESDB_USER = "${{Postgres.PGUSER}}"
DB_POSTGRESDB_PASSWORD = "${{Postgres.PGPASSWORD}}"
QUEUE_BULL_REDIS_HOST = "${{redis.RAILWAY_PRIVATE_DOMAIN}}"
QUEUE_BULL_REDIS_PORT = "6379"
QUEUE_BULL_REDIS_PASSWORD = "${{redis.REDIS_PASSWORD}}"
QUEUE_BULL_REDIS_DB = "0"
WEBHOOK_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
N8N_AUTH_TRUSTED_PROXY_SECRET = "${{TRUSTED_PROXY_SECRET}}"
N8N_REINSTALL_MISSING_PACKAGES = "false"

[n8n-worker]
# Runtime parity invariant: main/worker/webhook are all built from the same
# Dockerfile (see root railway.toml). startCommand is the subcommand passed
# to /docker-entrypoint.sh — do NOT prefix with `n8n` or `/usr/local/bin/n8n`.
startCommand = "worker"

[n8n-worker.variables]
N8N_PORT = "5678"
EXECUTIONS_MODE = "queue"
N8N_RUNNERS_ENABLED = "true"
N8N_CONCURRENCY_PRODUCTION_LIMIT = "10"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_DATABASE = "railway"
DB_POSTGRESDB_SCHEMA = "n8n"
DB_POSTGRESDB_HOST = "${{Postgres.PGHOST}}"
DB_POSTGRESDB_PORT = "${{Postgres.PGPORT}}"
DB_POSTGRESDB_USER = "${{Postgres.PGUSER}}"
DB_POSTGRESDB_PASSWORD = "${{Postgres.PGPASSWORD}}"
QUEUE_BULL_REDIS_HOST = "${{redis.RAILWAY_PRIVATE_DOMAIN}}"
QUEUE_BULL_REDIS_PORT = "6379"
QUEUE_BULL_REDIS_PASSWORD = "${{redis.REDIS_PASSWORD}}"
QUEUE_BULL_REDIS_DB = "0"
WEBHOOK_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
N8N_AUTH_TRUSTED_PROXY_SECRET = "${{TRUSTED_PROXY_SECRET}}"
N8N_REINSTALL_MISSING_PACKAGES = "false"

[n8n-webhook]
# Runtime parity invariant: main/worker/webhook are all built from the same
# Dockerfile (see root railway.toml). startCommand is the subcommand passed
# to /docker-entrypoint.sh — do NOT prefix with `n8n` or `/usr/local/bin/n8n`.
startCommand = "webhook"

[n8n-webhook.variables]
N8N_PORT = "5678"
EXECUTIONS_MODE = "queue"
N8N_RUNNERS_ENABLED = "true"
DB_TYPE = "postgresdb"
DB_POSTGRESDB_DATABASE = "railway"
DB_POSTGRESDB_SCHEMA = "n8n"
DB_POSTGRESDB_HOST = "${{Postgres.PGHOST}}"
DB_POSTGRESDB_PORT = "${{Postgres.PGPORT}}"
DB_POSTGRESDB_USER = "${{Postgres.PGUSER}}"
DB_POSTGRESDB_PASSWORD = "${{Postgres.PGPASSWORD}}"
QUEUE_BULL_REDIS_HOST = "${{redis.RAILWAY_PRIVATE_DOMAIN}}"
QUEUE_BULL_REDIS_PORT = "6379"
QUEUE_BULL_REDIS_PASSWORD = "${{redis.REDIS_PASSWORD}}"
QUEUE_BULL_REDIS_DB = "0"
WEBHOOK_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
N8N_AUTH_TRUSTED_PROXY_SECRET = "${{TRUSTED_PROXY_SECRET}}"
N8N_REINSTALL_MISSING_PACKAGES = "false"

# ─── Twenty CRM ────────────────────────────────────────────────
# Self-hosted open-source CRM (https://github.com/twentyhq/twenty)
# Uses existing Postgres + Redis. Storage via Railway Bucket.

[twenty-crm-server]
image = "twentycrm/twenty:v0.50.0"
startCommand = ""

[twenty-crm-server.variables]
PORT = "3000"
NODE_PORT = "3000"
NODE_ENV = "production"
# NOTE: Temporarily using Railway URL until custom domain is fixed.
# Once levinnovation.crm.agentyx.one works, switch back to it.
SERVER_URL = "https://twenty-crm-server-production-622c.up.railway.app"
APP_SECRET = "${{secret(32)}}"
PG_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=twenty_crm"
REDIS_URL = "redis://:${{redis.REDIS_PASSWORD}}@${{redis.RAILWAY_PRIVATE_DOMAIN}}:6379"
# NOTE: Must be lowercase "s3" — Twenty validates against enum "s3, local"
STORAGE_TYPE = "s3"
STORAGE_S3_REGION = "us-east-1"
STORAGE_S3_NAME = "${{twenty-crm-bucket.BUCKET_NAME}}"
STORAGE_S3_ENDPOINT = "${{twenty-crm-bucket.BUCKET_ENDPOINT}}"
STORAGE_S3_ACCESS_KEY_ID = "${{twenty-crm-bucket.BUCKET_ACCESS_KEY_ID}}"
STORAGE_S3_SECRET_ACCESS_KEY = "${{twenty-crm-bucket.BUCKET_SECRET_ACCESS_KEY}}"
# Migrations run once on first deploy; disable afterwards to avoid entrypoint crash
DISABLE_DB_MIGRATIONS = "true"
DISABLE_CRON_JOBS_REGISTRATION = "false"
IS_MULTIWORKSPACE_ENABLED = "false"
IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS = "true"
IS_CONFIG_VARIABLES_IN_DB_ENABLED = "true"
AUTH_PASSWORD_ENABLED = "true"
TRUST_PROXY = "loopback, linklocal, uniquelocal"

[twenty-crm-worker]
image = "twentycrm/twenty:v0.50.0"
# NOTE: Railway CLI does not support custom startCommand for image-based
# services. The worker currently runs the default CMD (full server process).
# Background jobs are still processed by the server process.
startCommand = ""

[twenty-crm-worker.variables]
PORT = "3000"
NODE_PORT = "3000"
NODE_ENV = "production"
SERVER_URL = "https://twenty-crm-server-production-622c.up.railway.app"
APP_SECRET = "${{secret(32)}}"
PG_DATABASE_URL = "${{Postgres.DATABASE_URL}}?schema=twenty_crm"
REDIS_URL = "redis://:${{redis.REDIS_PASSWORD}}@${{redis.RAILWAY_PRIVATE_DOMAIN}}:6379"
STORAGE_TYPE = "s3"
STORAGE_S3_REGION = "us-east-1"
STORAGE_S3_NAME = "${{twenty-crm-bucket.BUCKET_NAME}}"
STORAGE_S3_ENDPOINT = "${{twenty-crm-bucket.BUCKET_ENDPOINT}}"
STORAGE_S3_ACCESS_KEY_ID = "${{twenty-crm-bucket.BUCKET_ACCESS_KEY_ID}}"
STORAGE_S3_SECRET_ACCESS_KEY = "${{twenty-crm-bucket.BUCKET_SECRET_ACCESS_KEY}}"
DISABLE_DB_MIGRATIONS = "true"
DISABLE_CRON_JOBS_REGISTRATION = "true"
IS_MULTIWORKSPACE_ENABLED = "false"
TRUST_PROXY = "loopback, linklocal, uniquelocal"

# ─── Twenty CRM Bucket ─────────────────────────────────────────
# Railway S3-compatible object storage. Credentials auto-injected.
[twenty-crm-bucket]
# Bucket services are provisioned via Railway UI / API.
# This stanza documents the dependency for variable references above.
