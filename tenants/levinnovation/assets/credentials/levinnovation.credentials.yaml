# levinnovation tenant credentials
# All values are vault placeholders — resolved at deploy time by the Agentyx compiler.
# Never commit real credentials to the repository.

- id: openrouter-api-levinnovation
  name: OpenRouter API
  type: openrouterApi
  tenant: levinnovation
  data:
    apiKey: ${VAULT::OPENROUTER_API_KEY}
    baseUrl: "https://openrouter.ai/api/v1"

- id: composio-mcp-levinnovation
  name: Composio MCP
  type: composioMcp
  tenant: levinnovation
  data:
    apiKey: ${VAULT::COMPOSIO_API_KEY}
    baseUrl: "https://backend.composio.dev/api"

- id: kapso-api-levinnovation
  name: Kapso API
  type: kapsoApi
  tenant: levinnovation
  data:
    apiKey: ${VAULT::KAPSO_API_KEY}
    baseUrl: "https://api.kapso.ai"
    phoneNumberId: ${VAULT::KAPSO_PHONE_NUMBER_ID}

- id: telegram-bot-levinnovation
  name: Telegram Bot
  type: telegramBot
  tenant: levinnovation
  data:
    botToken: ${VAULT::TELEGRAM_BOT_TOKEN}
    baseUrl: "https://api.telegram.org"

- id: twenty-crm-levinnovation
  name: Twenty CRM
  type: twentyCrmApi
  tenant: levinnovation
  data:
    apiKey: ${VAULT::TWENTY_API_KEY}
    baseUrl: "https://twenty-crm-server-production-622c.up.railway.app"

- id: redis-levinnovation
  name: Redis (Memory)
  type: redisAccount
  tenant: levinnovation
  data:
    host: ${VAULT::REDIS_HOST}
    port: 6379
    password: ${VAULT::REDIS_PASSWORD}

- id: agentyx-api-levinnovation
  name: Agentyx API
  type: agentyxApi
  tenant: levinnovation
  data:
    apiKey: ${VAULT::AGENTYX_API_KEY}
    baseUrl: ${VAULT::AGENTYX_API_URL}

- id: pinecone-levinnovation
  name: Pinecone Vector DB
  type: pineconeApi
  tenant: levinnovation
  data:
    apiKey: ${VAULT::PINECONE_API_KEY}
    environment: ${VAULT::PINECONE_ENVIRONMENT}
    indexName: ${VAULT::PINECONE_INDEX_NAME}

- id: slack-levinnovation
  name: Slack Webhook
  type: slackApi
  tenant: levinnovation
  data:
    webhookUrl: ${VAULT::SLACK_WEBHOOK_URL}
    botToken: ${VAULT::SLACK_BOT_TOKEN}
