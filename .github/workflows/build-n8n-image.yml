name: Build and Push Custom n8n Image

on:
  push:
    branches: [main]
    paths:
      - 'services/n8n-node-sdk/**'
      - 'services/n8n-yaml-compiler/Dockerfile.n8n'
      - '.github/workflows/build-n8n-image.yml'
      - '.github/workflows/_reusable/**'
      - '.github/workflows/railway-deploy.yml'
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'Upstream n8n version tag'
        required: true
        default: '2.21.2'
      deploy_to_railway:
        description: 'Deploy to Railway after build'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: levinnovation/agentyx-vertical-assets/agentyx-n8n

jobs:
  build-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd services/n8n-node-sdk
          npm ci

      - name: Build nodes
        run: |
          cd services/n8n-node-sdk
          npm run build
          # Copy SVG icons alongside compiled JS (tsc doesn't handle .svg)
          for node_dir in src/nodes/*/; do
            node_name=$(basename "$node_dir")
            mkdir -p "dist/nodes/$node_name"
            cp "$node_dir"*.svg "dist/nodes/$node_name/" 2>/dev/null || true
          done
          ls -la dist/nodes/

      - name: Upload built nodes
        uses: actions/upload-artifact@v4
        with:
          name: n8n-nodes-agentyx
          path: services/n8n-node-sdk/dist/

  build-image:
    needs: build-nodes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built nodes
        uses: actions/download-artifact@v4
        with:
          name: n8n-nodes-agentyx
          path: custom-nodes/@levinnovation/n8n-nodes-agentyx/dist/

      - name: Copy package.json
        run: |
          cp services/n8n-node-sdk/package.json custom-nodes/@levinnovation/n8n-nodes-agentyx/package.json
          cp services/n8n-node-sdk/tsconfig.json custom-nodes/@levinnovation/n8n-nodes-agentyx/tsconfig.json || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{ github.sha }}
            type=raw,value=${{ inputs.n8n_version || '2.21.2' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/n8n-yaml-compiler/Dockerfile.n8n
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            N8N_VERSION=${{ inputs.n8n_version || '2.21.2' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-railway:
    needs: build-image
    if: ${{ inputs.deploy_to_railway != false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [n8n-main, n8n-worker, n8n-webhook]
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | bash
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Verify Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway whoami

      - name: Link project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          PROJECT_ID=$(printenv LEVINNOVATION_RAILWAY_PROJECT_ID)
          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: LEVINNOVATION_RAILWAY_PROJECT_ID is not set."
            exit 1
          fi
          railway link --project "$PROJECT_ID" --environment production

      - name: Sync variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          bash scripts/railway/sync-vars.sh --tenant levinnovation --service ${{ matrix.service }}

      - name: Deploy service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          bash scripts/railway/deploy-service.sh \
            --tenant levinnovation \
            --service ${{ matrix.service }} \
            --env production \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke test
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          bash scripts/railway/smoke-test.sh \
            --tenant levinnovation \
            --service ${{ matrix.service }} \
            --env production