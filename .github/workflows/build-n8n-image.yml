name: Build and Push Custom n8n Image

on:
  push:
    branches: [main]
    paths:
      - 'services/n8n-node-sdk/**'
      - 'services/n8n-yaml-compiler/Dockerfile.n8n'
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'Upstream n8n version tag'
        required: true
        default: '2.21.2'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: levinnovation/agentyx-n8n

jobs:
  build-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd services/n8n-node-sdk
          npm ci

      - name: Build nodes
        run: |
          cd services/n8n-node-sdk
          npm run build

      - name: Upload built nodes
        uses: actions/upload-artifact@v4
        with:
          name: n8n-nodes-agentyx
          path: services/n8n-node-sdk/dist/

  build-image:
    needs: build-nodes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built nodes
        uses: actions/download-artifact@v4
        with:
          name: n8n-nodes-agentyx
          path: custom-nodes/@levinnovation/n8n-nodes-agentyx/dist/

      - name: Copy package.json
        run: |
          cp services/n8n-node-sdk/package.json custom-nodes/@levinnovation/n8n-nodes-agentyx/package.json
          cp services/n8n-node-sdk/tsconfig.json custom-nodes/@levinnovation/n8n-nodes-agentyx/tsconfig.json || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{ github.sha }}
            type=raw,value=${{ inputs.n8n_version || '2.21.2' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/n8n-yaml-compiler/Dockerfile.n8n
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            N8N_VERSION=${{ inputs.n8n_version || '2.21.2' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
