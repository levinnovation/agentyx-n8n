name: Deploy Euromobilia Agent — Hostinger

on:
  workflow_dispatch:

jobs:
  build:
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_reusable/build-agent-image.yml
    with:
      tenant: euromobilia
      asset_name: quotation-assistant
      dockerfile_path: tenants/euromobilia/assets/deploy/agent-hostinger/Dockerfile
      build_context: tenants/euromobilia/assets/agents/quotation-assistant
      ghcr_image: ghcr.io/${{ github.repository_owner }}/euromobilia-agent-quotation-assistant
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy:
    needs: build
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_reusable/ssh-deploy.yml
    with:
      host: ${{ secrets.HOSTINGER_HOST }}
      user: ${{ secrets.HOSTINGER_USER }}
      deploy_script: |
        cd /opt/euromobilia-agent
        export AGENT_IMAGE=ghcr.io/${{ github.repository_owner }}/euromobilia-agent-quotation-assistant:${{ github.sha }}
        echo "Deploying image: $AGENT_IMAGE"
        docker compose pull
        docker compose up -d
        echo "Waiting for healthcheck..."
        sleep 5
        curl -sf http://localhost:8000/health || { echo "Health check failed"; exit 1; }
        echo "Deploy OK"
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
