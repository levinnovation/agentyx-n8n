name: n8n Deterministic Deploy

on:
  push:
    branches: [main]
    paths:
      - 'tenants/**/assets/workflows/n8n/**'
      - 'tenants/**/assets/credentials/**'
      - 'services/n8n-yaml-compiler/**'
  workflow_dispatch:
    inputs:
      tenant:
        required: true
        type: choice
        options: [euromobilia, levinnovation]
      environment:
        required: true
        type: choice
        options: [dev, prod]
      dry_run:
        type: boolean
        default: true
      asset:
        type: string
        description: 'Specific asset name (optional, blank = all)'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install typer httpx pyyaml

      - name: Compile n8n assets
        run: |
          # Compile each asset, extracting domain/capability from asset.yaml
          for dir in tenants/${{ inputs.tenant }}/assets/workflows/n8n/*/; do
            ASSET=$(basename "$dir")
            YAML="$dir/asset.yaml"
            if [ -f "$YAML" ] && [ -f "$dir/workflow.yaml" ]; then
              DOMAIN=$(python3 -c "import yaml; print(yaml.safe_load(open('$YAML'))['asset']['domain'])")
              CAPABILITY=$(python3 -c "import yaml; print(yaml.safe_load(open('$YAML'))['asset']['capability'])")
              echo "Compiling $ASSET (domain=$DOMAIN, capability=$CAPABILITY)"
              python3 scripts/compile_n8n_asset.py \
                --tenant ${{ inputs.tenant }} \
                --domain "$DOMAIN" \
                --capability "$CAPABILITY" \
                --asset "$ASSET"
            else
              echo "SKIP $ASSET (no asset.yaml or already compiled JSON)"
            fi
          done

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-n8n-${{ inputs.tenant }}
          path: |
            tenants/${{ inputs.tenant }}/assets/workflows/n8n/**/workflow.json
            tenants/${{ inputs.tenant }}/assets/credentials/**

  deploy:
    needs: compile
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-n8n-${{ inputs.tenant }}
          path: ./compiled/

      - name: Deploy to n8n
        run: |
          pip install httpx
          N8N_URL="${{ inputs.environment == 'prod' && secrets.N8N_URL_PROD || secrets.N8N_URL_DEV }}"
          N8N_API_KEY="${{ inputs.environment == 'prod' && secrets.N8N_API_KEY_PROD || secrets.N8N_API_KEY_DEV }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: would deploy to $N8N_URL"
            exit 0
          fi
          if [ -z "$N8N_URL" ] || [ -z "$N8N_API_KEY" ]; then
            echo "ERROR: N8N_URL or N8N_API_KEY secret not set for ${{ inputs.environment }}"
            exit 1
          fi
          python3 scripts/deploy_n8n_workflows.py \
            --tenant ${{ inputs.tenant }} \
            --env ${{ inputs.environment }} \
            --n8n-url "$N8N_URL" \
            --api-key "$N8N_API_KEY" \
            ${{ inputs.asset && format('--assets {0}', inputs.asset) || '--all' }}