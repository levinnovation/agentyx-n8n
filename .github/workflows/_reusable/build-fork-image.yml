name: Build and Push Fork Image

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      ref:
        required: true
        type: string
      image_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: "Dockerfile"
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Docker meta
        id: meta
        run: |
          SHA="${{ github.sha }}"
          TAG="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${SHA}"
          LATEST="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest"
          echo "tags=${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ inputs.repo }}
            org.opencontainers.image.revision=${{ github.sha }}
