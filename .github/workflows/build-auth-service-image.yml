name: Build Auth Service Image

on:
  push:
    branches: [agentyx/main]
    paths:
      - '**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_reusable/build-fork-image.yml
    with:
      repo: levinnovation/agentyx-auth-service
      ref: agentyx/main
      image_name: agentyx-auth-service
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
