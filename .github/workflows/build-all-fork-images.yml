name: Build and Push All Fork Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/forks/**'
      - '.github/workflows/build-all-fork-images.yml'

jobs:
  build-auth-service:
    uses: ./.github/workflows/_reusable/build-fork-image.yml
    with:
      repo: levinnovation/agentyx-auth-service
      ref: agentyx/main
      image_name: agentyx-auth-service
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  build-client-portal:
    uses: ./.github/workflows/_reusable/build-fork-image.yml
    with:
      repo: levinnovation/agentyx-client-portal
      ref: agentyx/main
      image_name: agentyx-client-portal
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  build-librechat:
    uses: ./.github/workflows/_reusable/build-fork-image.yml
    with:
      repo: levinnovation/agentyx-librechat
      ref: agentyx/main
      image_name: agentyx-librechat
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  build-flowise:
    uses: ./.github/workflows/_reusable/build-fork-image.yml
    with:
      repo: levinnovation/agentyx-flowise
      ref: agentyx/main
      image_name: agentyx-flowise
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  build-paperclip:
    uses: ./.github/workflows/_reusable/build-fork-image.yml
    with:
      repo: levinnovation/agentyx-paperclip
      ref: agentyx/main
      image_name: agentyx-paperclip
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy-to-railway:
    needs: [build-auth-service, build-client-portal, build-librechat, build-flowise, build-paperclip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Deploy GHCR images to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/railway/deploy-ghcr-images.sh
