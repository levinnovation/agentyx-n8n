name: Portal Source Lock

on:
  pull_request:
    branches: [main]

jobs:
  source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical portal source lock
        run: python scripts/ci/check-portal-source-lock.py
