# Railway configuration for services deployed from this repo via `railway up`
# Other services (n8n, flowise, librechat, paperclip, portal) are deployed from their own repos.
#
# NOTE: Each service below has its own railway.toml in its root directory
# that specifies the builder (e.g., DOCKERFILE for better-auth and auth-proxy).
# Do NOT add a global [build] section here — it would force ALL services
# (including those from other repos like the portal) to use the same builder.

[better-auth]
root = "services/better-auth"
startCommand = ""

[better-auth.variables]
PORT = "3000"
BETTER_AUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
BETTER_AUTH_DATABASE_URL = "${{Postgres.DATABASE_URL}}"

[auth-proxy]
root = "services/auth-proxy"
startCommand = ""

[auth-proxy.variables]
BETTER_AUTH_INTERNAL_URL = "agx-demo-better-auth.railway.internal:3000"
N8N_INTERNAL_URL = "agx-demo-n8n.railway.internal:5678"
FLOWISE_INTERNAL_URL = "agx-demo-flowise.railway.internal:3000"
PAPERCLIP_INTERNAL_URL = "agx-demo-paperclip.railway.internal:3100"
LIBRECHAT_INTERNAL_URL = "agx-demo-librechat.railway.internal:3080"

# ─── n8n Queue-Mode Cluster ──────────────────────────────────────
# Source: Railway-linked to levinnovation/agentyx-vertical-assets, builds the
# Agentyx custom n8n image directly from services/n8n-yaml-compiler/Dockerfile.n8n.
# This avoids the private-GHCR-pull failure (Railway has no GHCR credentials)
# that took the cluster down on 2026-05-20.
#
# startCommand: Railway executes this directly (it BYPASSES the image
# ENTRYPOINT, so you must call the full n8n binary, not just the subcommand):
#   * "n8n start"    → main process (HTTP + scheduler)
#   * "n8n worker"   → bull queue worker
#   * "n8n webhook"  → webhook-only process
# Failure modes observed on 2026-05-20:
#   "/docker-entrypoint.sh n8n start" → entrypoint re-prefixes `n8n` and
#       `exec n8n n8n start` errors with `Command "n8n" not found`.
#   "worker" alone → Railway runs the literal command and fails with
#       `The executable "worker" could not be found`.

[agx-demo-n8n]
startCommand = "n8n start"

[agx-demo-n8n.build]
builder = "DOCKERFILE"
dockerfilePath = "services/n8n-yaml-compiler/Dockerfile.n8n"

[agx-demo-n8n.deploy]
healthcheckPath = "/healthz"

[agx-demo-n8n-worker]
startCommand = "n8n worker"

[agx-demo-n8n-worker.build]
builder = "DOCKERFILE"
dockerfilePath = "services/n8n-yaml-compiler/Dockerfile.n8n"

[agx-demo-n8n-webhook]
startCommand = "n8n webhook"

[agx-demo-n8n-webhook.build]
builder = "DOCKERFILE"
dockerfilePath = "services/n8n-yaml-compiler/Dockerfile.n8n"
